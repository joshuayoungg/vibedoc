[package]
name = "inkwell-ai"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
imagesize = "0.15.0"
inkwell-core = { version = "0.1.0", path = "../inkwell-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.7"
ureq = { version = "3.4.2", features = ["json", "platform-verifier"] }

[dev-dependencies]
inkwell-docx = { path = "../inkwell-docx" }
