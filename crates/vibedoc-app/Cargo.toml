[package]
name = "vibedoc-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vibedoc"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
eframe = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
vibedoc-ai = { version = "0.1.0", path = "../vibedoc-ai" }
vibedoc-core = { version = "0.1.0", path = "../vibedoc-core" }
vibedoc-docx = { version = "0.1.0", path = "../vibedoc-docx" }
vibedoc-pdf = { version = "0.1.0", path = "../vibedoc-pdf" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.7"
